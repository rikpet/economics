[project]
name = "economics"
version = "1.0.0"
description = "Handling my private economy"
dependencies = [
    "pandas",
    "xlrd",
    "click",
    "tabulate"
]
readme = {file = "README.md", content-type = "text/markdown"}

[dependency-groups]
test = [
    "pytest"
]
lint = [
    "ruff"
]
dev = [
    "economics[test,lint]"
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
econ = "app:main"