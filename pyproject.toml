[project]
name = "economics"
version = "2.11.1"
description = "Handling my private and family economy"
dependencies = [
    "pandas",
    "xlrd",
    "click",
    "tabulate",
    "questionary"
]
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
web = [
    "flask",
    "waitress"
]
test = [
    "pytest",
    "economics[web]"
]
lint = [
    "ruff"
]
dev = [
    "economics[test,lint]"
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
econ = "app:main"